{% extends 'base.html' %}
{% block content %}
<h2>Update Profile</h2>

<form method="post">
  {% csrf_token %}
  <fieldset>
    <legend>Profile Info</legend>
    {{ profile_form.as_p }}
  </fieldset>

  <fieldset>
    <legend>Change Password</legend>
    {{ password_form.as_p }}
  </fieldset>

  <button type="submit">Update</button>
</form>
{% endblock %}
